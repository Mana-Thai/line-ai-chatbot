const stepped=(p,n)=>Math.round(clamp(p,0,1)*n)/n;
function isLit(t){
  if(t>=10560) return true;
  if(t<10200)  return false;
  return (t<10320)||(t>=10420&&t<10480);

const STAND_Y=432;
function ladderOffset(t){
  if(t<2280) return {lx:0,ly:0};
  if(t<2380) return {lx:0,ly:-12*Math.min(1,(t-2280)/100)};
  if(t<2980) return {lx:lerp(0,-151,stepped((t-2380)/600,8)),ly:-12};       // 「O-I」中央へ
  if(t<3080) return {lx:-151,ly:-12+12*Math.min(1,(t-2980)/100)};
  if(t<5980) return {lx:-151,ly:0};
  if(t<6080) return {lx:-151,ly:-12*Math.min(1,(t-5980)/100)};
  if(t<6680) return {lx:lerp(-151,119,stepped((t-6080)/600,8)),ly:-12};      // 「T」中央へ
  if(t<6780) return {lx:119,ly:-12+12*Math.min(1,(t-6680)/100)};
  return {lx:119,ly:0};
}
function placePhase(t,s0,slots,topx,sTX){
  const wf=Math.floor(t/120)%2;
  const i=clamp(Math.floor((t-s0)/400),0,slots.length-1);
  const s=s0+i*400, u=t-s;
  const from=i===0?topx:sTX(slots[i-1]);
  const x=lerp(from,sTX(slots[i]),stepped(clamp(u/130,0,1),3));
  const st={x,y:STAND_Y,f:u<130?wf:0,back:true,xs:1};
  let ar=0;
  if(u>=100&&u<260) ar=stepped((u-100)/160,6);
  else if(u>=260&&u<320) ar=1;
  else if(u>=320) ar=stepped(1-(u-320)/80,4);
  if(u>=100&&ar>0){
    const scx=tileCX(slots[i]);
    const sx=x+(scx>=x?40:-40), sy=STAND_Y-50;
    st.arm={sx,sy,hx:lerp(sx,scx,ar),hy:lerp(sy,TILE_Y+TILE_H+8,ar)};
    if(u<320) st.carry=slots[i];
  }
  return st;
}

    return {x:lerp(377,382,p),y:lerp(963,940,p),f:0,back:false,xs:1,pose:p<0.35?"fallen":(p<0.7?"stumble":"stand")}; }
  if(t<1900) return {x:lerp(382,398,stepped((t-1650)/250,3)),y:940,f:wf,back:false,xs:1,pose:"walk"};
  if(t<2080) return {x:398,y:940,f:0,back:false,xs:1};
  if(t<2280){ const q=(t-2080)/200;
    return {x:398,y:940,f:0,back:q>0.5,xs:Math.abs(Math.cos(Math.PI*q))}; }
  if(t<3080) return {x:398+L.lx,y:940,f:(2380<=t&&t<2980)?wf:0,back:true,xs:1,up:true};   // はしごを運ぶ①
  if(t<3780){ const p=stepped((t-3080)/700,10);
    return {x:lerp(398+L.lx,538+L.lx,p)+wob,y:lerp(940,STAND_Y,p),f:Math.floor(t/140)%2,back:true,xs:1}; }
  if(t<5380) return placePhase(t,3780,[0,1,2,3],538+L.lx,sTX);                            // JOIN を掲げる
  if(t<5980){ const p=stepped((t-5380)/600,10);                                           // 同じラインで降りる
    return {x:lerp(538+L.lx,398+L.lx,p)+wob,y:lerp(STAND_Y,940,p),f:Math.floor(t/140)%2,back:true,xs:1}; }
  if(t<6780) return {x:398+L.lx,y:940,f:(6080<=t&&t<6680)?wf:0,back:true,xs:1,up:true};   // はしごを運ぶ②
  if(t<7480){ const p=stepped((t-6780)/700,10);
    return {x:lerp(398+L.lx,538+L.lx,p)+wob,y:lerp(940,STAND_Y,p),f:Math.floor(t/140)%2,back:true,xs:1}; }
  if(t<8680) return placePhase(t,7480,[5,6,7],538+L.lx,sTX);                              // STC を掲げる
  if(t<8930){ const q=clamp((t-8730)/200,0,1);
    return {x:sTX(7),y:STAND_Y,f:0,back:q<0.5,xs:t<8730?1:Math.abs(Math.cos(Math.PI*q))}; }
  if(t<9580){ const p=stepped(clamp((t-8930)/650,0,1),14);
    return {x:lerp(sTX(7),945,p),y:STAND_Y+508*p*p-260*p*(1-p),f:1,back:false,xs:1}; }
  if(t<9830){ const q=clamp((t-9580)/250,0,1);
    return {x:945,y:940-14*Math.sin(Math.PI*q),f:0,back:false,xs:1}; }
  return {x:945,y:940,f:0,back:false,xs:1};
}

/* ---------- scene ---------- */
const PLACE_AT={0:4100,1:4500,2:4900,3:5300,5:7800,6:8200,7:8600};
function drawTiles(t,lit){
  for(const slot of [0,1,2,3,5,6,7]){
    if(t<PLACE_AT[slot]) continue;
    const dd=t-PLACE_AT[slot];
    const o=dd<70?-8*Math.sin(Math.PI*dd/70):0;
    const x=TILE_X0+slot*(TILE_W+GAP), y=TILE_Y+o;
    const gx=x+(TILE_W-5*10)/2, gy=y+(TILE_H-7*10)/2;
    if(!lit){ ctx.fillStyle=TILE; ctx.fillRect(x,y,TILE_W,TILE_H); }
    drawTextPixBold(LETTERS[slot],gx,gy,10,RED);
  }
}
function drawArm(a){
  ctx.fillStyle=SKIN;
  const dx=a.hx-a.sx, dy=a.hy-a.sy, n=Math.max(1,Math.round(Math.hypot(dx,dy)/7));
  for(let i=0;i<=n;i++) ctx.fillRect(a.sx+dx*i/n-4.5, a.sy+dy*i/n-4.5, 9, 9);
  ctx.fillRect(a.hx-7,a.hy-7,14,14);
}
function drawCarriedTile(slot,hx,hy){
  const x=hx-TILE_W/2, y=hy-TILE_H-4;
  ctx.fillStyle=TILE; ctx.fillRect(x,y,TILE_W,TILE_H);
  drawTextPixBold(LETTERS[slot],x+(TILE_W-50)/2,y+(TILE_H-70)/2,10,RED);
}
function drawCaption(t){
  if(t<10700) return;
  const s="THANK YOU MOM";
  const n=clamp(Math.floor((t-10700)/40),0,s.length);
  const tw=textW(s,5);
  ctx.save(); ctx.shadowColor=YEL; ctx.shadowBlur=8;
  drawTextPix(s.slice(0,n),540-tw/2,978,5,YEL); ctx.restore();
  if(t>=11600){
    const a=clamp((t-11600)/500,0,1);
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign="center";
    ctx.fillStyle="#4f7f82"; ctx.font='700 34px "Leelawadee UI", "Tahoma", sans-serif';
    ctx.fillText("สุขสันต์วันแม่",540,1042); ctx.restore();
  }
}

/* ---------- main loop ---------- */
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const previewValue=new URLSearchParams(location.search).get("t");
const previewTime=previewValue===null?null:clamp(Number(previewValue)||0,0,DUR-1);
const t0=performance.now();
function frame(now){
  if(!reduced&&previewTime===null) requestAnimationFrame(frame); // 先に予約: 1フレーム失敗しても止まらない
  try{
    const t=previewTime!==null?previewTime:(reduced?12500:(((now-t0)%DUR)+DUR)%DUR);
    const lit=isLit(t);
    ctx.fillStyle=BG; ctx.fillRect(0,0,1080,1080);
    drawPetals(t);

    /* 実測トレース点群 = 看板・タブ・アーム・鉄塔・影のすべて */
    const L=ladderOffset(t);
    drawDots(MAIN,DIM,1);
    drawDots(TOWER,DIM,1,L.lx,L.ly);
    drawDots(NEAR,lit?HALO:DIM,1);

    if(lit){
      drawDots(CORONA,HALO,0.95);
      ctx.save();
      ctx.shadowColor=LIT; ctx.shadowBlur=80;
      ctx.fillStyle=LIT;
      ctx.beginPath(); ctx.roundRect(SIGN.x,SIGN.y,SIGN.w,SIGN.h,SIGN.r); ctx.fill();
      ctx.restore();
      ctx.fillStyle=TILE;
      ctx.beginPath(); ctx.roundRect(TAB.x,TAB.y,TAB.w,TAB.h,TAB.r); ctx.fill();
      ctx.save(); ctx.shadowColor=AMBER; ctx.shadowBlur=12;
      drawTextPix(TABTXT,TABTX,TABTY,TPX,AMBER); ctx.restore();
    }else{
      drawTextPix(TABTXT,TABTX,TABTY,TPX,DIMTXT);
    }

    drawTiles(t,lit); drawCaption(t);
    const b=girlPose(t);
    if(b.arm) drawArm(b.arm);
    drawTripCue(t,b);
    drawGirl(b.x,b.y,b.f,b.back,b.xs,b.pose);
    if(b.up){ ctx.fillStyle=SKIN;
      ctx.fillRect(b.x-38,b.y-84,9,44); ctx.fillRect(b.x+29,b.y-84,9,44); }
    if(b.arm&&b.carry!==undefined) drawCarriedTile(b.carry,b.arm.hx,b.arm.hy);
  }catch(e){ /* keep the loop alive */ }
}
requestAnimationFrame(frame);

/* ---------- WebM export ---------- */
const btn=document.getElementById("rec");
btn.addEventListener("click",()=>{
  btn.disabled=true; btn.textContent="ループ開始を待機中…";
  const phase=(((performance.now()-t0)%DUR)+DUR)%DUR;
  setTimeout(()=>{
    const stream=cv.captureStream(30);
    const mime=MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
      ? "video/webm;codecs=vp9" : "video/webm";
    const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000});
    const chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      const url=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));
      const a=document.createElement("a");
      a.href=url; a.download="stc-mothersday-marquee.webm"; a.click();
      URL.revokeObjectURL(url);
      btn.disabled=false; btn.textContent="\u2B07 WebMを書き出す";
    };
    btn.textContent="録画中…(13秒)";
    rec.start();
    setTimeout(()=>rec.stop(),DUR);
  }, DUR-phase);
});
</script>
