      </filter>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8D6828"/><stop offset=".48" stop-color="#F5D994"/>
        <stop offset="1" stop-color="#A97B2D"/>
      </linearGradient>


