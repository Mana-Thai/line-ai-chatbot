# 伝統テニス大会 オーダー表(Cloudflare版): Workers(画面+API)+ D1(データ)
name = "tennis-lineup"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# LIFF_ID / LINE_LOGIN_CHANNEL_ID / SESSION_SECRET / ADMIN_SETUP_CODE は
# Cloudflare の画面(Settings → Variables and Secrets)で設定する。deploy しても消えないようにする
keep_vars = true

# 画面(public/ は ../build.py で生成してコミットする)
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# データベース。database_id を書かなければ、最初の deploy で D1「tennis-lineup」が自動で作られる
# (自分で作った D1 を使う場合は database_id = "..." を足す)
[[d1_databases]]
binding = "DB"
database_name = "tennis-lineup"
