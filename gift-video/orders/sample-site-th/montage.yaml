# サイト掲載用サンプル(タイ語・娘から母へ)。
#   ①冒頭の手紙カード → ②時系列の写真6枚 → ③結びの手紙カード → 締め(order.yaml)
# 写真の並びは「幼少期 → 学校 → 旅 → 誕生日 → 大人になって → 現在」。
# 自称 หนู / 文末 ค่ะ(娘から母へ)で統一している。

default_duration: 5

photos:
  # ── ① 冒頭: 宛名と書き出し ──
  - letter: |-
      ถึงแม่ที่รักของหนู

      หนูลองนึกย้อนกลับไป
      ถึงสิ่งที่แม่ทำเพื่อหนู
      ทีละอย่าง ทีละอย่าง
    duration: 7

  # ── ② 時系列の写真 ──
  - file: "01-childhood.jpg"
    caption: "หนูเคยวิ่งกลับบ้าน เพื่อเอาดอกไม้มาให้แม่"
    preset: zoom-in
  - file: "02-school.jpg"
    caption: "ทุกเช้า แม่ถักผมให้หนู ก่อนไปโรงเรียน"
    preset: sway
  - file: "03-bus.jpg"
    caption: "บนรถสายนั้น หนูหลับบนไหล่แม่เสมอ"
    preset: zoom-out
  - file: "04-birthday.jpg"
    caption: "เค้กก้อนเล็กๆ ที่แม่ทำให้ทุกปี"
    preset: zoom-in
  - file: "05-cooking.jpg"
    caption: "วันนี้หนูโตแล้ว ได้ยืนทำกับข้าวข้างๆ แม่"
    preset: sway
  - file: "06-together.jpg"
    caption: "และหนูอยากอยู่ข้างๆ แม่แบบนี้ ไปนานๆ"
    duration: 6
    preset: zoom-in

  # ── ③ 結び: いちばん伝えたい言葉 ──
  # 最後の2秒に締めのタイトル(order.yaml の couple_names)が重なるため、
  # ラストのカードは**2行まで**にして画面下を空けておく
  - letter: |-
      หนูไม่เคยพูดออกมา
      แต่หนูจำได้ทุกอย่าง
    duration: 5
  - letter: |-
      ต่อจากนี้ ถึงตาหนูบ้าง
      ที่จะดูแลแม่
    duration: 7
