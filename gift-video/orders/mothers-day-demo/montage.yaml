# 母親向け「あなたが私にしてくれたこと」の標準構成(デモ)。
# 子どもの頃から現在までを時間順に並べる。写真は photos/ に時系列順の名前で置く。
#
# caption は画面下に出る文字(空にすれば出ない)。年号を入れると時間の流れが伝わる。
# duration は表示秒数。preset でカメラワークを指定できる。

default_duration: 5

photos:
  - file: "01-baby.jpg"
    caption: "1996年 — わたしを抱いてくれた日"
    preset: zoom-in
  - file: "02-family.jpg"
    caption: "いつも、家族の真ん中にいた"
    preset: sway
  - file: "03-school.jpg"
    caption: "運動会も卒業式も、必ず来てくれた"
    preset: zoom-out
  - file: "04-trip.jpg"
    caption: "はじめての家族旅行"
    preset: pan-right
  - file: "05-laughing.jpg"
    caption: "その笑い声が、家じゅうを明るくした"
    duration: 6
    preset: zoom-in
  - file: "06-grandchild.jpg"
    caption: "そして今、孫たちに同じ愛を"
    duration: 6
    preset: sway
