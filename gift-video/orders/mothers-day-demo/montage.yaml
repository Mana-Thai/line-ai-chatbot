# 母親向け「あなたが私にしてくれたこと」— Etsy系人気商品を参考にした3部構成(デモ)。
#   ①冒頭の手紙カード → ②時系列の写真 → ③結びの手紙カード → 締め(order.yaml)
# 手紙(文章)が商品価値の中心。映像は派手に動かさず、ゆっくりした上品な演出にする。

default_duration: 5

photos:
  # ── ① 冒頭: 宛名と書き出し ──
  - letter: |-
      お母さんへ

      あなたが私にしてくれたことを
      ひとつずつ、思い出してみました
    duration: 7

  # ── ② 時系列の写真(子どもの頃 → 現在) ──
  - file: "01-baby.jpg"
    caption: "1996年 — わたしを抱いてくれた日"
    preset: zoom-in
  - file: "02-family.jpg"
    caption: "いつも、家族の真ん中にいた"
    preset: sway
  - file: "03-school.jpg"
    caption: "運動会も卒業式も、必ず来てくれた"
    preset: zoom-out
  - file: "04-trip.jpg"
    caption: "はじめての家族旅行"
    preset: zoom-in
  - file: "05-laughing.jpg"
    caption: "その笑い声が、家じゅうを明るくした"
    preset: sway
  - file: "06-grandchild.jpg"
    caption: "そして今、孫たちに同じ愛を"
    duration: 6
    preset: zoom-in

  # ── ③ 結び: いちばん伝えたい言葉 ──
  - letter: |-
      言葉にしなかっただけで
      ぜんぶ、覚えています

      今度はわたしが
      あなたを大切にする番です
    duration: 8
