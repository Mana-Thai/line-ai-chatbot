order_id: "mothers-day-demo"
couple_names: "お母さん、ありがとう"   # ラスト2秒に大きく出る(この商品では締めの言葉に使う)
anniversary_date: "2026 母の日"
scene1_caption: ""                  # 写真ごとの文字は scene_captions で入れるので未使用
message: ""                          # 画面中央の長文メッセージ(手紙は letter カードで見せる)
message_start_sec: 0
target_duration: 46                 # 手紙7秒 + 写真(5×5+6)秒 + 手紙8秒 = 46秒
output_formats: ["landscape"]       # 縦型は2パス目で作る(--size 1080x1920 → portrait。手順はREADME)
portrait_mode: "crop"
mix_scene_audio: false              # 写真素材に音声は無いのでBGMのみ
show_names: true                    # ラストの「お母さん、ありがとう」を表示する

# シーンごとのキャプション(build_montage.py が出力したものを貼る。手紙カードは空)
scene_captions:
  - ""
  - "1996年 — わたしを抱いてくれた日"
  - "いつも、家族の真ん中にいた"
  - "運動会も卒業式も、必ず来てくれた"
  - "はじめての家族旅行"
  - "その笑い声が、家じゅうを明るくした"
  - "そして今、孫たちに同じ愛を"
  - ""
