# タイ語版「สิ่งที่แม่ทำเพื่อหนู(お母さんがしてくれたこと)」— 母の日デモ。
#
# タイの母の日は【8月12日】(シリキット王妃誕生日)。花はマリ(ジャスミン)。
# 話者は娘=หนู(女性の自称)、息子なら ผม に置き換える。文末は ค่ะ(女性)/ ครับ(男性)。
#
# フォントは Noto Sans Thai が自動で選ばれる(日本語フォントではタイ文字が □ になる)。

default_duration: 5

photos:
  # ── ① 冒頭: 宛名と書き出し ──
  - letter: |-
      ถึงแม่ที่รักของหนู

      หนูได้นึกถึงสิ่งที่แม่ทำเพื่อหนู
      ทีละอย่าง ทีละอย่าง
    duration: 7

  # ── ② 時系列の写真(幼少期 → 現在) ──
  - file: "01-baby.jpg"
    caption: "พ.ศ. ๒๕๓๙ — วันที่แม่โอบกอดหนูครั้งแรก"
    preset: zoom-in
  - file: "02-family.jpg"
    caption: "แม่อยู่ตรงกลางของครอบครัวเสมอ"
    preset: sway
  - file: "03-school.jpg"
    caption: "งานกีฬาสี วันรับปริญญา แม่มาทุกครั้ง"
    preset: zoom-out
  - file: "04-trip.jpg"
    caption: "ทริปแรกของครอบครัวเรา"
    preset: zoom-in
  - file: "05-laughing.jpg"
    caption: "เสียงหัวเราะของแม่ทำให้ทั้งบ้านสว่างขึ้น"
    preset: sway
  - file: "06-grandchild.jpg"
    caption: "และวันนี้ แม่ก็ให้ความรักแบบเดียวกันกับหลาน"
    duration: 6
    preset: zoom-in

  # ── ③ 結び: いちばん伝えたい言葉 ──
  - letter: |-
      หนูไม่เคยพูดออกมา
      แต่หนูจำได้ทุกอย่าง

      ต่อจากนี้ ถึงตาหนูบ้าง
      ที่จะดูแลแม่
    duration: 8
