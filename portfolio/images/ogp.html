<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0} body{width:1200px;height:630px;overflow:hidden;background:#edf4f3;color:#1d2b2d;font-family:"Sarabun","Noto Sans Thai","Noto Sans CJK JP",sans-serif;display:grid;grid-template-columns:58% 42%;position:relative}body:after{content:"";position:absolute;inset:22px;border:1px solid rgba(185,147,78,.58);pointer-events:none}.copy{padding:82px 40px 70px 84px;display:flex;flex-direction:column;justify-content:center}.eyebrow{color:#b9934e;font:500 18px/1.4 "Kanit",sans-serif;letter-spacing:6px}.copy h1{font:400 67px/1.18 "Kanit",sans-serif;letter-spacing:-1px;margin:22px 0 18px}.copy h1 em{color:#466e72;font-style:normal}.jp{font-size:26px;color:#4f6263;line-height:1.6}.brand{position:absolute;left:84px;bottom:54px;font:500 18px/1 "Kanit",sans-serif;letter-spacing:2px}.art{background:radial-gradient(circle at 50% 42%,#fffef8 0 34%,#dbe9e8 72%,#bed4d5 100%);position:relative;display:grid;place-items:center}.oval{width:350px;height:460px;border-radius:50%;border:2px solid #b9934e;position:relative;box-shadow:inset 0 0 0 15px rgba(255,255,255,.38)}.oval:before{content:"";position:absolute;inset:28px;border:1px solid #88aeb2;border-radius:50%;opacity:.7}.stem{position:absolute;width:6px;height:245px;background:#466e72;left:176px;top:128px;transform:rotate(-8deg);border-radius:9px}.flower{position:absolute;width:75px;height:75px;background:#fffdf7;border:2px solid rgba(185,147,78,.55);border-radius:50% 18% 50% 18%;transform:rotate(45deg)}.flower:after{content:"";position:absolute;inset:28px;background:#b9934e;border-radius:50%}.f1{top:86px;left:148px}.f2{top:215px;left:195px;width:58px;height:58px}.f2:after{inset:21px}.f3{top:246px;left:102px;width:62px;height:62px}.f3:after{inset:23px}.line{position:absolute;width:215px;height:70px;left:67px;bottom:34px;border-bottom:2px solid #b9934e;border-radius:50%}
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">A SMALL FILM FOR A BIG FEELING</p>
    <h1 lang="th">เก็บคำว่า <em>“ขอบคุณ”</em><br>ไว้ในภาพยนตร์สั้น</h1>
    <p class="jp">言葉にできなかった「ありがとう」を、<br>何度でも見返したくなる小さな映画に。</p>
    <p class="brand">GIFT &amp; DESIGN STUDIO — THAILAND</p>
  </div>
  <div class="art"><div class="oval"><span class="stem"></span><span class="flower f1"></span><span class="flower f2"></span><span class="flower f3"></span><span class="line"></span></div></div>
</body>
</html>
