<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: "Kanit", "Noto Sans Thai", "Garuda", "Noto Sans CJK JP", sans-serif;
    background: linear-gradient(150deg, #F4FAFF 0%, #DFF0FF 55%, #BFDFF8 100%);
    color: #17307E;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .mark { font-size: 88px; }
  h1 { font-size: 74px; letter-spacing: 0.04em; margin-top: 8px; }
  .lead { font-size: 38px; color: #33528F; margin-top: 18px; line-height: 1.6; }
  .tags { display: flex; gap: 18px; margin-top: 34px; }
  .tag {
    background: #FFFFFF; border-radius: 999px;
    padding: 14px 30px; font-size: 30px; font-weight: 700;
    color: #17307E; box-shadow: 0 4px 12px rgba(23,48,126,0.14); border: 2px solid #E8A03C;
  }
</style>
</head>
<body>
  <div class="mark">🎁</div>
  <h1>Gift &amp; Design Studio</h1>
  <div class="lead">วิดีโอของขวัญ ・ ออกแบบเสื้อ ・ เว็บไซต์ ・ แชทบอท<br>ギフト動画・Tシャツデザイン・Web制作(日タイ対応)</div>
  <div class="tags">
    <span class="tag">🎬 วิดีโอของขวัญ</span>
    <span class="tag">👕 ออกแบบเสื้อ</span>
    <span class="tag">🌐 เว็บไซต์</span>
    <span class="tag">🤖 LINE Bot</span>
  </div>
</body>
</html>
