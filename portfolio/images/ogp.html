<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0} body{width:1200px;height:630px;overflow:hidden;background:#f8f6ef;color:#1d2b2d;font-family:"Sarabun","Noto Sans Thai","Noto Sans CJK JP",sans-serif;display:grid;grid-template-columns:62% 38%;position:relative}body:after{content:"";position:absolute;inset:22px;border:1px solid rgba(185,147,78,.58);pointer-events:none;z-index:4}.copy{padding:68px 46px 68px 84px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}.eyebrow{color:#b9934e;font:500 17px/1.4 "Kanit",sans-serif;letter-spacing:5px}.copy h1{font:400 55px/1.18 "Kanit",sans-serif;letter-spacing:-1px;margin:18px 0 15px}.copy h1 em{color:#466e72;font-style:normal}.jp{font-size:24px;color:#4f6263;line-height:1.55}.offer{display:inline-block;width:max-content;margin-top:20px;padding:8px 14px;border-left:3px solid #b9934e;background:#edf4f3;color:#466e72;font:500 22px/1.3 "Kanit",sans-serif}.brand{position:absolute;left:84px;bottom:48px;font:500 15px/1 "Kanit",sans-serif;letter-spacing:2px}.art{position:relative;overflow:hidden;background:#18272b}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,39,43,.1),transparent 35%),linear-gradient(0deg,rgba(24,39,43,.65),transparent 42%)}.art img{width:100%;height:100%;object-fit:cover;object-position:center 42%;filter:saturate(.8) contrast(1.03)}.caption{position:absolute;z-index:2;left:28px;right:28px;bottom:32px;color:#fff;font:400 15px/1.5 "Kanit",sans-serif;letter-spacing:2px}.caption span{display:block;color:#dfc990;font-size:13px;margin-bottom:3px}
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">MOTHER’S DAY FILM ・ 12 AUGUST</p>
    <h1 lang="th">เมื่อเข้าใจแล้วว่า<br>แม่เหนื่อยแค่ไหน<br><em>คำว่า “ขอบคุณ”</em><br>จึงมีความหมาย</h1>
    <p class="jp">働く大変さを知った今、<br>あの頃言えなかった「ありがとう」を母へ。</p>
    <p class="offer">30 วินาที・1,290 THB</p>
    <p class="brand">GIFT &amp; DESIGN STUDIO — THAILAND</p>
  </div>
  <div class="art"><img src="../assets/sample-mothersday_poster.jpg" alt=""><p class="caption"><span>STORY FILM</span>FROM THE DAY I FIRST SAW YOU</p></div>
</body>
</html>
